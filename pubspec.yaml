name: flutter_getx_starter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  dio: ^5.9.0
  intl: ^0.20.2
  hive_ce: ^2.11.4
  hive_ce_flutter: ^2.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  skeletonizer: ^2.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  hive_ce_generator: ^1.9.3
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/myriad_pro/

  fonts:
    - family: MyriadPro
      fonts:
        - asset: assets/fonts/myriad_pro/MYRIADPRO-REGULAR.ttf
        - asset: assets/fonts/myriad_pro/MYRIADPRO-LIGHT.ttf
          weight: 300
        - asset: assets/fonts/myriad_pro/MYRIADPRO-SEMIBOLD.ttf
          weight: 600
        - asset: assets/fonts/myriad_pro/MYRIADPRO-SEMIBOLDIT.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/myriad_pro/MYRIADPRO-BOLD.ttf
          weight: 700
        - asset: assets/fonts/myriad_pro/MYRIADPRO-BOLDIT.ttf
          weight: 700
          style: italic
